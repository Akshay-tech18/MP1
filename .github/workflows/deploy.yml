name: Deploy Backend to Laptop Server

on:
  push:
    branches:
      - dev-self-hosted
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    name: Build & Deploy to Dokku
    runs-on: self-hosted
    steps:
      - name: Pull Latest Code and Deploy in Dokku
        run: |
          echo "🚀 Pulling latest dev-self-hosted code..."
          sudo dokku git:sync devpilot-backend https://github.com/Akshay-tech18/MP1.git dev-self-hosted
          echo "🔄 Restarting container with port 5001..."
          sudo dokku ps:stop devpilot-backend || true
          sudo dokku ps:start devpilot-backend
          echo "✅ Deployment completed successfully!"
